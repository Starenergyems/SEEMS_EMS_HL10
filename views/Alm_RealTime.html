<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!--  default -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--  default -->
    <title>即時告警</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css"><!--dataTable-->
    <link href="styles/style_template.css" rel="stylesheet" type="text/css" />
    <link href="styles/Alm_RealTime.css" rel="stylesheet" type="text/css" />
    <!--<link href="http://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet" type="text/css" />-->
</head>

<body>
    <div class="T_Main">
        <img src="images/Star_Energy_Logo.png" alt="星佑能源Logo" id="starEnergy_Logo">
        <h1>花蓮康舒E-dReg10M(地號4-1)</h1>
        <div class="dateTime_Username">
            <label id="dateTime_Now">2000/01/01 23:59:59</label>
            <img src="images/User_Pic.png" alt="使用者圖示" id="user_Logo">
            <label for="qaz" id="userAccount">Administrator</label>
            <div class="accountNavBar">
                <a href="PersonalInfo.html" id="accNB_01">個人資料</a>
                <a href="AccountManage.html" id="accNB_02">人員管理</a>
                <a href="Login.html" id="accNB_03">登出</a>
            </div>
        </div>
    </div>

    <div class="L_Main">
        <div class="systemStatus">
            <label class="systemMode" id="L_M_systemMode">調頻服務中</label>
            <div class="sumAWNum sumAlarmNum">
                <img src="images/Alarm_Logo.png" alt="Alarm圖示" class="alert_Logo">
                <label class="totalAWNum" id="totalAlarmNum">999</label>
                <img src="images/DropDown_Logo.png" alt="下拉式按鈕圖示" class="dropDown_Logo" id="dD_Logo_sumAlarmNum">
                <div class="sumAW_EachArea sumAlarm_EachArea">
                    <div class="sumAW_Area sumAlarm_Meter">電表<label class="AWNum" id="AlarmNum_Meter">2</label></div>
                    <div class="sumAW_Area sumAlarm_PCS">PCS<label class="AWNum" id="AlarmNum_PCS">1</label></div>
                    <div class="sumAW_Area sumAlarm_Bat">電池<label class="AWNum" id="AlarmNum_Bat">99+</label></div>
                    <div class="sumAW_Area sumAlarm_Env">環境<label class="AWNum" id="AlarmNum_Env">11</label></div>
                    <div class="sumAW_Area sumAlarm_FF">消防<label class="AWNum" id="AlarmNum_FF">54</label></div>
                </div>
            </div>
            <div class="sumAWNum sumWarningNum">
                <img src="images/Warning_Logo.png" alt="Warning圖示" class="alert_Logo">
                <label class="totalAWNum" id="totalWarningNum">52</label>
                <img src="images/DropDown_Logo.png" alt="下拉式按鈕圖示" class="dropDown_Logo" id="dD_Logo_sumWarningNum">
                <div class="sumAW_EachArea sumWarning_EachArea">
                    <div class="sumAW_Area sumWarning_Meter">電表<label class="AWNum" id="WarningNum_Meter">0</label>
                    </div>
                    <div class="sumAW_Area sumWarning_PCS">PCS<label class="AWNum" id="WarningNum_PCS">3</label></div>
                    <div class="sumAW_Area sumWarning_Bat">電池<label class="AWNum" id="WarningNum_Bat">99+</label></div>
                    <div class="sumAW_Area sumWarning_Env">環境<label class="AWNum" id="WarningNum_Env">99</label></div>
                    <div class="sumAW_Area sumWarning_FF">消防<label class="AWNum" id="WarningNum_FF">87</label></div>
                </div>
            </div>
        </div>
        <div class="navBar">
            <a href="Mode_SysCtrl.html"><button class="button_nB" id="nB_Mode">模式控制</button></a>
            <a href="Op_Meter_SLD.html"><button class="button_nB" id="nB_Operation">運轉資訊</button></a>
            <a href="Sys_Comm.html"><button class="button_nB" id="nB_System">系統資訊</button></a>
            <a href="Alm_RealTime.html"><button class="button_nB default_nB" id="nB_Alarm">告警紀錄</button></a>
            <a href="Evt_Operation.html"><button class="button_nB" id="nB_Event">事件紀錄</button></a>
            <a href="Rpt_Report.html"><button class="button_nB" id="nB_Report">報表</button></a>
            <a href="Cht_RealTime.html"><button class="button_nB" id="nB_Chart">即時圖/歷史圖</button></a>
        </div>
        <div class="systemInfo">
            <p class="subTitle">|| 系統資訊 ||</p>

            <div class="DV_Line">頻率<label class="dataValue" id="L_M_freq">60.123</label>
                <p class="dataUnit">Hz</p>
            </div>
            <div class="DV_Line">實功<label class="dataValue" id="L_M_activeP">12345.6</label>
                <p class="dataUnit">kW</p>
            </div>
            <div class="DV_Line">虛功<label class="dataValue" id="L_M_reactiveP">-9876.5</label>
                <p class="dataUnit">kVar</p>
            </div>
            <div class="DV_Line">電壓<label class="dataValue" id="L_M_voltage">23.456</label>
                <p class="dataUnit">kV</p>
            </div>
            <div class="DV_Line">電流<label class="dataValue" id="L_M_current">78.87</label>
                <p class="dataUnit">A</p>
            </div>
            <div class="DV_Line">功因<label class="dataValue" id="L_M_powerFactor">-0.999</label>
                <p class="dataUnit"></p>
            </div>
            <div class="DV_Line">平均SOC<label class="dataValue" id="L_M_avgSOC">87.6</label>
                <p class="dataUnit">%</p>
            </div>
            <div class="DV_Line">最低SOH<label class="dataValue" id="L_M_minSOH">98.7</label>
                <p class="dataUnit">%</p>
            </div>
            <div class="DV_Line">SBSPM<label class="dataValue" id="L_M_SBSPM">98.00</label>
                <p class="dataUnit">%</p>
            </div>

            <div class="DV_Line spareLine">當日充放電量</div>

            <div class="DV_Line">充電<label class="dataValue" id="L_M_chgEtoday">45678.9</label>
                <p class="dataUnit">kWh</p>
            </div>
            <div class="DV_Line lastLine">放電<label class="dataValue" id="L_M_dcgEtoday">56789.0</label>
                <p class="dataUnit">kWh</p>
            </div>
        </div>
        <div class="eStop">
            <img src="images/EPO_Logo.png" alt="緊急停止鈕圖示_Logo" id="epo_Logo">
            <p class="epo_word">緊急停止鈕</p>
        </div>

        <div class="popUpWindow epo">
            <h2 class="titlePUW">緊急停止設定</h2>

            <img src="images/Alarm_Logo_v1.png" alt="Alarm圖示" class="alert_Logo">
            <p class="epoInfo">確認停機</p>

            <button class="closeWindowButton" id="closeWB_Yes">確認</button>
            <button class="closeWindowButton" id="closeWB_No">取消</button>
        </div>
    </div>

    <div class="R_Main">
        <div class="subNavBar" id="sub_NavBar">
            <!-- <h2>模式控制</h2> -->
            <div class="button_sNB default_sNB" id="sNB_01">
                <a href="Alm_RealTime.html" class="name_button_sNB">即時告警</a>
            </div>
            <div class="button_sNB" id="sNB_02">
                <a href="Alm_History.html" class="name_button_sNB">歷史告警</a>
            </div>
        </div>

        <div class="M_Page">
            <div class="title">
                <h2>【即時告警】</h2>
                <button class="clickBut" id="filtNone">總覽</button>
                <div class="filter filtDevice">
                    <p>設備</p>
                    <img src="images/DropDown_Logo_v1.png" alt="下拉式選單圖示_v1" id="dDL_filtDevice">
                    <div class="filtOptions">
                        <button class="filtOpt" id="deviceFO_01">控制室</button>
                        <button class="filtOpt" id="deviceFO_02">電腦主機</button>
                        <button class="filtOpt" id="deviceFO_03">保護電驛</button>
                        <button class="filtOpt" id="deviceFO_04">GC</button>
                        <button class="filtOpt" id="deviceFO_05">自動復閉器</button>
                        <button class="filtOpt" id="deviceFO_06">電表</button>
                        <button class="filtOpt" id="deviceFO_07">UPS</button>
                        <button class="filtOpt" id="deviceFO_08">HVAC</button>
                    </div>
                </div>
                <div class="filter filtLocation">
                    <p>地點</p>
                    <img src="images/DropDown_Logo_v1.png" alt="下拉式選單圖示_v1" id="dDL_filtLocation">
                    <div class="filtOptions">
                        <button class="filtOpt" id="locationFO_01">控制室</button>
                        <button class="filtOpt" id="locationFO_02">MVCB</button>
                        <button class="filtOpt" id="locationFO_03">VCB-1</button>
                        <button class="filtOpt" id="locationFO_04">VCB-2</button>
                        <button class="filtOpt" id="locationFO_05">VCB-3</button>
                        <button class="filtOpt" id="locationFO_06">VCB-4</button>
                        <button class="filtOpt" id="locationFO_07">ACP-1</button>
                        <button class="filtOpt" id="locationFO_08">ACP-2</button>
                        <button class="filtOpt" id="locationFO_09">ACP-3</button>
                        <button class="filtOpt" id="locationFO_10">ACP-4</button>
                    </div>
                </div>
                <div class="filter filtLevel">
                    <p>等級</p>
                    <img src="images/DropDown_Logo_v1.png" alt="下拉式選單圖示_v1" id="dDL_filtLevel">
                    <div class="filtOptions">
                        <button class="filtOpt" id="levelFO_01">警告</button>
                        <button class="filtOpt" id="levelFO_02">錯誤</button>
                    </div>
                </div>
            </div>

            <div class="almRealTime">
                <table class="" id="almTable">
                    <thead>
                        <tr>
                            <th class="col_00">No.</th>
                            <th>時間</th>
                            <th>地點</th>
                            <th>設備名稱</th>
                            <th>等級</th>
                            <th>告警內容</th>
                            <th>數值</th>
                            <th>已讀&nbsp<input type="checkbox" class="chb_Ack" id="chb_AckAll"></th>
                            <th>復歸</th>
                            <th class="col_last">復歸時間</th>
                        </tr>
                    </thead>
                </table>





            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script><!--dataTable-->
    <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script> <!--dataTable-->
    <script src="scripts/script_template.js"></script>
    <script src="scripts/Alm_RealTime.js"></script>
</body>

</html>
