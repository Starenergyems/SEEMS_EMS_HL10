# 全局配置

# 設定用來接收外部連接的端口（MQTT 默認端口 1883）
listener 31883

# 設定使用者密碼檔案（如不使用可註釋掉）
# password_file /mosquitto/config/password.txt

# 是否允許匿名用戶訪問（默認允許）
allow_anonymous true

# 設置日誌輸出級別（可以是: debug, info, notice, warning, error）
log_type all

# 日誌文件的存儲路徑（可選）
# log_dest file /mosquitto/log/mosquitto.log

# 啟用持久性存儲消息和訂閱（1.6 版之前默認關閉，之後默認開啟）
# persistence true

# 設置持久性存儲的數據文件路徑（可選）
# persistence_location /mosquitto/data/

# 設置最大並發連接數（0 表示不限制）
# max_connections 100

# 設置最大消息大小（單位：字節，0 表示不限制）
# message_size_limit 0

# 設定用來接收 MQTT over WebSocket 連接的端口（可選）
# listener 9001
# protocol websockets

# 如果需要為特定客戶端設定權限，可使用 ACL 檔案
# acl_file /mosquitto/config/acl.txt

# 安全設置

# 啟用 SSL/TLS（如不需要，可註釋掉以下部分）
# listener 8883
# cafile /mosquitto/config/ca.crt
# certfile /mosquitto/config/server.crt
# keyfile /mosquitto/config/server.key

# 密碼驗證和 ACL 控制（如不需要，可註釋掉以下部分）
# allow_anonymous false
# password_file /mosquitto/config/password.txt
# acl_file /mosquitto/config/acl.txt

# 設置客戶端連接超時（秒）
# connection_timeout 60

# 設置心跳檢查時間（秒）
# keepalive_interval 60

# 設置消息重發間隔時間（秒）
# retry_interval 20
