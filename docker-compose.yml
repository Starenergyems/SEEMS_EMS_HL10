services:
  ems-service:
    image: ems-service_v1
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Taipei
      - HOST_IP=192.168.1.12
    volumes:
      - ./router:/usr/src/app/router # 挂载本地 router 文件夹到容器中
    ports:
      - "3000:3000"
    working_dir: /usr/src/app/router # 指定工作目錄為 /usr/src/app/router
    command: ["node", "app.js"]
    deploy:
      replicas: 1
      restart_policy:
        condition: unless-stopped
        delay: 5s
        window: 120s
    networks:
      - ems-service-network

networks:
  ems-service-network:
    driver: bridge
