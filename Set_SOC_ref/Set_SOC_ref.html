<body>
    <div>
        <table id="table_01">
            <tr class="row_01">
                <td class="col_01"></td>
                <td class="col_02">SOC (%)</td>
                <td class="col_03">Voltage (V)</td>
            </tr>
            <tr class="row_other">
                <td class="col_01">Max Limit</td>
                <td class="col_02"><label for="qaz" class="data_value" id="data_val_01">90.0</label></td>

            </tr>

                <td class="col_01">Upper bound</td>
                <td class="col_02"><label for="qaz" class="data_value" id="data_val_03">70.0</label></td>

            </tr>
            <tr class="row_other">
                <td class="col_01">Lower bound</td>
                <td class="col_02"><label for="qaz" class="data_value" id="data_val_05">60.0</label></td>
                <td class="col_03"><label for="qaz" class="data_value" id="data_val_06">930.0</label></td>
            </tr>
            <tr class="row_other">
                <td class="col_01">Min Limit</td>
                <td class="col_02"><label for="qaz" class="data_value" id="data_val_07">10.0</label></td>
                <td class="col_03"><label for="qaz" class="data_value" id="data_val_08">850.0</label></td>
